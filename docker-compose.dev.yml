services:
  postgres:
    image: postgres:16-alpine
    container_name: honey_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: honey_dev
    ports:
      - "5432:5432"
    volumes:
      - honey_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d honey_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  honey_postgres_dev_data:
    name: honey_postgres_dev_data
